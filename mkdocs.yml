site_name: Agentic AppSec Pilot Playbook
site_description: Hands-on material for running open-source agentic AppSec tooling on your own code, safely.

# Docs live at the repo root. Built with Zensical (reads mkdocs.yml natively):
#   uvx zensical serve    # live preview
#   uvx zensical build    # static HTML -> ./site (gitignored)
docs_dir: .
site_dir: site
use_directory_urls: true

exclude_docs: |
  mkdocs.yml
  .git/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid          # ```mermaid fences render as diagrams (also natively on GitHub)
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: README.md
  - 1 · Sandbox:
      - Threat model: sandbox/threat-model.md
      - Reference sandbox (Colima/Lima): sandbox/reference-sandbox.md
  - 2 · Tools:
      - Shortlist: tools/shortlist.md
  - 3 · Triage:
      - Triage rubric: triage/triage-rubric.md
      - Shared observations (run table): triage/observations.md
  - 4 · Validation:
      - Validation-loop record template: validation/validation-loop-template.md
  - 5 · Hardening:
      - Hardening checklist: hardening/hardening-checklist.md
      - Hardened CI runner (design): hardening/ci-runner-design.md
