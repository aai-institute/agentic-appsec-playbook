[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-sbx"
version = "0.2.0"
description = "Host-owned lifecycle, policy lock and explicit file transfer for an AppSec shell in Docker sbx"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
appsec-sbx = "appsec_sbx.cli:main"

[tool.setuptools]
packages = ["appsec_sbx"]

[tool.setuptools.package-data]
appsec_sbx = ["kit/*.yaml", "guest/*.sh", "guest/commands/*.md"]
