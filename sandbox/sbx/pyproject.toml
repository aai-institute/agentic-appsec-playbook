[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-sbx"
version = "0.2.0"
description = "Run agents in Docker Sandboxes with host-owned lifecycle, policy lock and explicit file transfer"
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "appliedAI Institute for Europe gGmbH" }]
dependencies = []

[project.scripts]
appsec-sbx = "appsec_sbx.cli:main"

[project.urls]
Homepage = "https://github.com/aai-institute/agentic-appsec-playbook"
Documentation = "https://github.com/aai-institute/agentic-appsec-playbook/tree/main/docs"

[tool.setuptools]
packages = ["appsec_sbx"]

[tool.setuptools.package-data]
appsec_sbx = ["kit/*.yaml", "guest/*.sh", "guest/*.py"]
